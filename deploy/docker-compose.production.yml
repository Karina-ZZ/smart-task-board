name: wangxu-ai-task-hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${WANGXU_BACKEND_ENV_FILE:-/etc/wangxu/backend.env}
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - wangxu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ${WANGXU_BACKEND_ENV_FILE:-/etc/wangxu/backend.env}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - edge

  chatservice:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.chatservice
    restart: unless-stopped
    env_file:
      - ${WANGXU_CHAT_ENV_FILE:-/etc/wangxu/chatservice.env}
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5).read()"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      chatservice:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./runtime/nginx/wangxu.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WANGXU_TLS_CERT_DIR:-/etc/wangxu/tls}:/etc/nginx/tls:ro
    networks:
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  wangxu_postgres_data:
